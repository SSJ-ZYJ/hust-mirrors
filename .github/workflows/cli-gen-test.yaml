name: Test CLI Generation

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream baseline
        uses: actions/checkout@v5
        with:
          repository: hust-open-atom-club/hust-mirrors
          ref: 5bfb0fa171f12a2c35faed88171727a3ce347f79

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: yarn typecheck

      - name: Run build
        id: build
        continue-on-error: true
        run: yarn build

      - name: Report baseline result
        if: always()
        run: |
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "build: ${{ steps.build.outcome }}"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi

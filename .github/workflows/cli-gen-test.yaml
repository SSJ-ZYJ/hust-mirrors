name: Test CLI Generation

on:
  workflow_dispatch:

jobs:
  patched:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patched commit
        uses: actions/checkout@v5
        with:
          repository: SSJ-ZYJ/hust-mirrors
          ref: b7ab5841cb6efb08f0c0e98d527bb81ec8bee1e8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run release regression test
        run: python3 ci/test/test-releases-conf.py -v

      - name: Run yarn tests
        run: yarn test

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: yarn typecheck

      - name: Run build
        id: build
        continue-on-error: true
        run: yarn build

      - name: Report patched result
        if: always()
        run: |
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "build: ${{ steps.build.outcome }}"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
